name: Validate Astro site

on:
  push:
    branches:
      - main
      - astro-migration
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Astro, TypeScript, and content
        run: npm run check

      - name: Build and validate static output
        run: npm run build
